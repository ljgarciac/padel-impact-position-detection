[project]
name = "padel-impact-position-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.8",
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "lap>=0.5.13",
    "matplotlib>=3.11.2",
    "mediapipe>=1.1.0",
    "mlflow>=3.17.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.615.71",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "roboflow>=1.3.10",
    "scikit-learn>=1.9.1",
    "segno>=1.6.6",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.157",
    "uvicorn[standard]>=0.54.0",
]

# Instala torch/torchvision con soporte CUDA (build cu132) en vez de la rueda CPU por defecto.
# Detectado para esta maquina: NVIDIA GeForce RTX 4070 Laptop GPU, driver con CUDA UMD 13.4
# (compatible con builds cu132 y anteriores). En una maquina sin GPU NVIDIA compatible,
# cambiar la URL de abajo a "https://download.pytorch.org/whl/cpu" (o correr
# `uv pip install torch torchvision --torch-backend=cpu`).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

# roboflow (usado solo para descargar el dataset) depende de opencv-python-headless, que
# instala el paquete `cv2` sin soporte de ventanas (highgui) y, al compartir el mismo nombre
# de paquete que opencv-python, puede sobrescribir sus archivos y romper cv2.imshow. Como
# opencv-python (con GUI) ya cubre todo lo que roboflow necesita de cv2, se excluye el
# transitivo headless. Lo mismo pasa con mediapipe, que arrastra opencv-contrib-python (otra
# variante del mismo paquete `cv2`): convivir con opencv-python hace que se pisen. mediapipe solo
# usa funciones base de cv2, que opencv-python ya trae.
[tool.uv]
override-dependencies = [
    "opencv-python-headless; python_version < '0'",
    "opencv-contrib-python; python_version < '0'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
